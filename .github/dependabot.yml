# Dependabot: a monthly look for newer versions of what the workflows and the asset tools
# use, one grouped pull request per kind. Godot itself isn't covered: GODOT_VERSION in the
# workflows is raised by hand when the project moves to a new engine.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  # The asset tools: a bump can change the baked sprites and sounds, which the pull
  # request's bake check (tools/check_bake.sh) catches.
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    groups:
      asset-tools:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Asset tools"
